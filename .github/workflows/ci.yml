# CI de Bullitik : à chaque push, sur toutes les branches.
#
#   linux    construit l'image du devcontainer (cache GitHub) et lance dedans
#            format, lint, tests, manifeste et CHANGELOG : la CI vérifie
#            exactement l'environnement de développement.
#   windows  même lint et mêmes tests sur un runner Windows natif, la cible
#            principale du livrable.
#
# Les pull requests venues d'un fork lancent aussi la CI (un push sur ce dépôt
# la lance déjà pour ses propres branches : pas de double exécution).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (devcontainer)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image du devcontainer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: bullitik-dev:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/cargo-registry
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.devcontainer/Dockerfile') }}
          restore-keys: linux-cargo-

      - name: Format, lint et tests dans le devcontainer
        run: |
          mkdir -p ~/cargo-registry target
          docker run --rm --user root \
            -v "$PWD":/workspaces/Bullitik \
            -v ~/cargo-registry:/home/ubuntu/.cargo/registry \
            bullitik-dev:ci \
            bash -euxo pipefail -c '
              cargo fmt --all --check
              cargo clippy --all-targets --locked -- -D warnings
              cargo test --locked
              cargo xtask check-manifest
              cargo xtask changelog check
            '

  windows:
    name: Windows
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked
