# CI de Bullitik : à chaque push, sur toutes les branches.
#
#   linux    construit l'image du devcontainer (cache GitHub) et lance dedans
#            format, lint, tests, manifeste et CHANGELOG : la CI vérifie
#            exactement l'environnement de développement.
#   windows  même lint et mêmes tests sur un runner Windows natif, puis les
#            exécutables des spikes, publiés en artefact
#            « bullitik-spikes-windows » pour les mesures sur un PC Windows.
#
# Les pull requests venues d'un fork lancent aussi la CI (un push sur ce dépôt
# la lance déjà pour ses propres branches : pas de double exécution).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (devcontainer)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image du devcontainer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: bullitik-dev:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/cargo-registry
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.devcontainer/Dockerfile') }}
          restore-keys: linux-cargo-

      - name: Cache des modèles de la CI
        uses: actions/cache@v6
        with:
          path: ~/models
          key: models-ci-${{ hashFiles('models/manifest.toml') }}
          restore-keys: models-ci-

      - name: Format, lint et tests dans le devcontainer
        run: |
          mkdir -p ~/cargo-registry ~/models target
          docker run --rm --user root \
            -v "$PWD":/workspaces/Bullitik \
            -v ~/cargo-registry:/home/ubuntu/.cargo/registry \
            -v ~/models:/workspaces/Bullitik/models/files \
            bullitik-dev:ci \
            bash -euxo pipefail -c '
              cargo fmt --all --check
              cargo clippy --all-targets --locked -- -D warnings
              cargo test --locked
              cargo xtask check-manifest
              cargo xtask changelog check
              cargo xtask fetch --set ci
              cargo test --release --locked -- --ignored
              cargo build --release --locked --workspace --bins
              cargo xtask package --out /tmp/dist
            '

  windows:
    name: Windows
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    env:
      # Dossier de build court : whisper.cpp génère des chemins si profonds
      # sous target\ qu'ils dépassent la limite Windows de 260 caractères.
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/sdk-vulkan-windows

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> C:\\t"

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Exécutables des spikes
        run: cargo build --release --locked --workspace --bins

      - name: Dossier des spikes pour Windows
        run: cargo xtask package --out .

      - name: Syntaxe du script de mesure
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\mesurer-spikes.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

      # Le dossier livré tourne-t-il sur un Windows nu ? Sans GPU : sur CPU, avec
      # les petits modèles de l'ensemble ci.
      - name: Essai du dossier des spikes sur le runner
        shell: pwsh
        working-directory: bullitik-spikes-windows
        run: |
          .\xtask.exe fetch --set ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\spike-stt.exe --cpu --model models\files\ggml-small-q5_1.bin --wav testdata\phrase.wav --repeat 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\spike-tts.exe --voice siwis --no-play --repeat 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\spike-llm.exe --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force models\files

      - uses: actions/upload-artifact@v7
        with:
          name: bullitik-spikes-windows
          path: bullitik-spikes-windows
          retention-days: 30
