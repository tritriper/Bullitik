# CD de Bullitik : à chaque tag v*, une release GitHub avec les dossiers
# portables (zip) pour Windows et Linux.
#
#   windows  build release natif, `cargo xtask package --zip`
#   linux    même chose dans l'image du devcontainer (Ubuntu 24.04)
#   publier  texte de la release = section du CHANGELOG pour cette version ;
#            pré-release si le tag contient un tiret (v0.1.0-rc1).
#
# La version fait foi via le tag : rien à modifier dans Cargo.toml. Tagger est
# la décision du responsable du projet (voir docs/dev/contributing.md).
#
# Les modèles (6,2 Go) ne sont pas dans les zips : GitHub refuse les fichiers de
# plus de 2 Go. `xtask fetch` les télécharge et vérifie leur SHA-256.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/sdk-vulkan-windows

      - name: Build et dossier portable
        shell: pwsh
        run: |
          $env:BULLITIK_VERSION = "$env:GITHUB_REF_NAME".TrimStart('v')
          cargo build --release --locked --workspace --bins
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo xtask package --out dist --zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/*.zip

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image du devcontainer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: bullitik-dev:ci
          load: true
          cache-from: type=gha

      - name: Build, dossier portable et notes de version
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          docker run --rm --user root \
            -e BULLITIK_VERSION="$version" \
            -v "$PWD":/workspaces/Bullitik \
            bullitik-dev:ci \
            bash -euxo pipefail -c "
              cargo build --release --locked --workspace --bins
              cargo xtask package --out dist --zip
              cargo xtask changelog extract '$version' > dist/notes.md \
                || echo 'Pré-version $version : voir CHANGELOG.md, section [Non publié].' > dist/notes.md
            "

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            dist/*.zip
            dist/notes.md

  publier:
    name: Publier la release
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bullitik $TAG" \
            --notes-file dist/notes.md \
            --verify-tag $prerelease
