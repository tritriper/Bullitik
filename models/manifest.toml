# Tout ce que le projet télécharge : modèles et binaires tiers.
#
# `cargo xtask fetch` lit ce fichier, télécharge chaque élément de l'ensemble
# demandé, vérifie sa taille et son SHA-256, puis le range :
#   - un modèle   → models/files/<file>
#   - un runtime  → runtime/<name>/ (archive extraite)
#
# Les URL pointent vers un commit précis (Hugging Face) ou une build précise
# (llama.cpp) : changer de version, c'est changer l'URL ET le SHA-256 ici.
#
# Ensembles (`sets`) :
#   dev       ce qu'il faut pour lancer tous les spikes (défaut de `fetch`) ;
#   ci        le minimum pour les tests de la CI, sur CPU ;
#   optional  seulement à la demande (`--with <id>`).

