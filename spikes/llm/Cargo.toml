[package]
name = "spike-llm"
description = "Spike 0.3 : Ministral 3 dans llama.cpp, rôles d'intervieweur et de juge (JSON), temps et mémoire mesurés."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", features = ["json"] }

[lints]
workspace = true
